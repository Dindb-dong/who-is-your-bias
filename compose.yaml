services:
  studio:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BIAS_LLM_BASE_URL: ${BIAS_LLM_BASE_URL:-}
      BIAS_LLM_MODEL: ${BIAS_LLM_MODEL:-}
      BIAS_LLM_API_KEY: ${BIAS_LLM_API_KEY:-}
      BIAS_TTS_BASE_URL: ${BIAS_TTS_BASE_URL:-}
      BIAS_TTS_MODEL: ${BIAS_TTS_MODEL:-}
      BIAS_TTS_API_KEY: ${BIAS_TTS_API_KEY:-}
      BIAS_TTS_VOICE: ${BIAS_TTS_VOICE:-default}
      BIAS_TTS_PERSONA_ID: ${BIAS_TTS_PERSONA_ID:-}
      BIAS_ASR_BASE_URL: ${BIAS_ASR_BASE_URL:-}
      BIAS_ASR_MODEL: ${BIAS_ASR_MODEL:-}
      BIAS_ASR_API_KEY: ${BIAS_ASR_API_KEY:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

