<!doctype html><html><head><meta charset="utf-8"><title>cmp</title>
<style>html,body{margin:0;background:#fff}canvas{width:512px;height:512px;display:block}</style></head>
<body><canvas id="c" width="512" height="512"></canvas>
<script type="module">
import { loadBundle, frameParams } from '/bundle/gaussian-head-core.js';
import { GaussianHeadRenderer } from '/bundle/gaussian-head-renderer.js';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const { header, B } = await loadBundle(q.get('bundle'));
const r = new GaussianHeadRenderer(canvas, header, B);
const cams = (await (await fetch(q.get('cams'))).json()).cams;
const out = [];
for (const c of cams) {
  canvas.width = c.width; canvas.height = c.height;
  r.render(frameParams(B, header, c.timestep), { view: new Float32Array(c.view_colmajor), fovY: c.fovY });
  out.push({ split: c.split, t: c.timestep, png: canvas.toDataURL('image/png') });
}
window.__out = { n: header.n_gauss, out };
</script></body></html>
