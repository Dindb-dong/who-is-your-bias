name: Studio validation

on:
  pull_request:
    paths:
      - '.github/workflows/studio-validation.yml'
      - 'apps/web/**'
      - 'src/bias/**'
      - 'tests/browser/**'
      - 'playwright*.ts'
      - 'package*.json'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.6
          uv sync --locked --extra dev
          npm ci
          npx playwright install --with-deps chromium
      - name: Check and build web application
        run: npm run check
      - name: Verify Jensen and shared runtime paths
        run: uv run pytest -q tests/test_jensen_persona.py tests/test_jensen_retrieval.py tests/test_query_evidence_policy.py tests/test_temporal_dialogue.py
      - name: Validate historical desktop and mobile flows
        run: npm run test:e2e
      - name: Validate Jensen selection and hand playback
        run: npm run test:attention
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
