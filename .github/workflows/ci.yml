name: Validate research studio

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked --extra dev
      - run: npm ci
      - run: uv run pytest
      - run: uv run bias validate
      - run: uv run bias evaluate --fail-on-regression --output reports/local/retrieval.json
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: |
            reports/local/retrieval.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

