name: Export reproducible avatar fixture
on:
  push:
    branches: ['feat/2026-persona-roadmap']
    paths: ['.github/workflows/avatar-fixture.yml']
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: research-avatar-fixture
          path: apps/web/public/models/research-human-v2.glb
          if-no-files-found: error
          retention-days: 3
